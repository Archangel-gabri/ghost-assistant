# Ghost — FAST config (recommended)
# faster-whisper "base" (RU+EN) + claude haiku. Balanced speed/accuracy on CPU.

screenshot:
  interval_ms: 500
  path: "temp_screen.png"
  hash_threshold: 5
  monitor: 0

backend:
  provider: "claude"
  model: "sonnet"                # same speed as haiku via CLI, but smarter
  # Каталог, в котором запускается CLI-инструмент: от него он видит файлы и
  # относительные пути. Пусто — берётся корень проекта. Впишите свой, если
  # спрашиваете про конкретный репозиторий.
  workdir: ""
  startup_timeout: 15
  response_timeout: 30

  # STT — "auto" uses Groq cloud (whisper-large-v3-turbo, ~0.5s) when
  # GROQ_API_KEY is set, else falls back to local faster-whisper (~2s, offline).
  #   backend: "auto" | "groq" | "faster-whisper" | "streaming"
  #   model:   local only — "tiny" | "base" (default) | "small" | "large-v3"
  #   language: "ru" forces Russian (faster + reliable); null = auto-detect
  # Get a FREE key at https://console.groq.com then:  export GROQ_API_KEY=...
  stt_backend: "auto"
  whisper_model: "base"
  language: "ru"

prompt:
  template: |
    Answer the following spoken question shortly and accurately.
    Language: Russian (ответь на русском).
    Keep it 1-2 sentences. Refer to project architecture or code visible in the attached screenshot: {screenshot_path}

    Question: {question}

overlay:
  enabled: true
  opacity: 0.8
  position: "bottom-center"
  auto_fade_seconds: 15
