# Ghost — voice + screen assistant — ULTRA-FAST configuration
# Optimized for speed: moonshine STT + claude haiku + streaming

screenshot:
  interval_ms: 500
  path: "temp_screen.png"
  hash_threshold: 5
  monitor: 0

backend:
  provider: "claude"
  # Fast model: haiku (instead of sonnet)
  model: "haiku"
  workdir: "<workdir>"
  startup_timeout: 15
  # Shorter timeout for faster feedback
  response_timeout: 30

  # STT backend selection
  # ✓ "moonshine"       - FASTEST (2-3x faster), 75M params, 95% accuracy
  # "distil-whisper"  - 6x faster than base, 59M params
  # "faster-whisper"  - current standard, good balance
  # "streaming"       - chunked streaming for progressive transcription
  # "auto"            - auto-detect fastest available
  stt_backend: "moonshine"

  # For moonshine/distil (ignored if using faster-whisper)
  whisper_model: "tiny"

prompt:
  template: |
    Answer the following spoken question shortly and accurately.
    Language: Russian (ответь на русском).
    Keep it 1-2 sentences. Refer to project architecture or code visible in the attached screenshot: {screenshot_path}

    Question: {question}

overlay:
  enabled: true
  opacity: 0.8
  position: "bottom-center"
  auto_fade_seconds: 15
