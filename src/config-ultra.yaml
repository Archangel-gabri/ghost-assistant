# Ghost — voice + screen assistant — ULTRA mode
# Max speed: faster-whisper "tiny" (RU+EN) + claude haiku. Lower RU accuracy.

screenshot:
  interval_ms: 500
  path: "temp_screen.png"
  hash_threshold: 8  # Higher threshold = skip more frames
  monitor: 0

backend:
  provider: "claude"
  model: "haiku"  # Fastest Claude model
  # Каталог, в котором запускается CLI-инструмент: от него он видит файлы и
  # относительные пути. Пусто — берётся корень проекта. Впишите свой, если
  # спрашиваете про конкретный репозиторий.
  workdir: ""
  startup_timeout: 10
  response_timeout: 15  # Ultra-aggressive timeout

  # tiny = fastest on CPU (weaker Russian accuracy; use "base" if it misreads)
  stt_backend: "faster-whisper"
  whisper_model: "tiny"
  language: "ru"

prompt:
  template: |
    Answer briefly in Russian. 1 sentence max.
    Screenshot: {screenshot_path}
    Q: {question}

overlay:
  enabled: true
  opacity: 0.8
  position: "bottom-center"
  auto_fade_seconds: 10
