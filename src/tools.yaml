# Ghost — tools & models registry (USER-EDITABLE)
# ---------------------------------------------------------------------------
# Add your own AI tools here — the UI reads this file to build the tool and
# model dropdowns. No code changes needed for a new tool.
#
# Each entry:
#   id:       short unique key
#   label:    name shown in the UI
#   provider: "claude" | "codex" | "generic"
#   models:   list shown in the model dropdown
#   command:  (generic only) shell template; {model} is substituted, the
#             prompt is fed on stdin, and the answer is read from stdout.
# ---------------------------------------------------------------------------

tools:
  - id: claude
    label: "Claude Code"
    provider: claude
    models: [sonnet, haiku, opus, fable]

  - id: codex
    label: "Codex"
    provider: codex
    models: [gpt-5.6-luna, gpt-5.6-sol, o3, gpt-5.5]

